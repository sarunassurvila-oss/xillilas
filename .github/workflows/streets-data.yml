name: Gatvių duomenys (Adresų registras)
on:
  push:
    branches: [claude/streets-data]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Atsisiųsti savivaldybes, gyvenvietes ir gatves
        run: |
          set +e
          : > out.txt
          finish() {
            body=$(sed -e 's/%/%25/g' out.txt | sed -e ':a;N;$!ba;s/\n/%0A/g' | cut -c1-30000)
            echo "::notice title=Gatves::$body"
          }
          trap finish EXIT
          echo "== data.gov.lt ==" >> out.txt
          for u in "https://get.data.gov.lt/datasets/gov/rc/ar/:ns" "https://get.data.gov.lt/datasets/gov/rc/ar/gatve/:ns" "https://get.data.gov.lt/datasets/gov/rc/ar/gatve/Gatve?limit(2)"; do
            echo "$u -> $(curl -sS -m 60 -o resp.txt -w '%{http_code}' "$u")" >> out.txt; head -c 600 resp.txt | tr '\n' ' ' >> out.txt; echo >> out.txt
          done
          echo "== registrucentras.lt ==" >> out.txt
          for u in "https://www.registrucentras.lt/p/1194" "https://www.registrucentras.lt/p/1186"; do
            echo "$u -> $(curl -sSL -m 60 -A 'Mozilla/5.0' -o page.html -w '%{http_code}' "$u")" >> out.txt
            grep -oiE 'href="[^"]+"' page.html | grep -iE 'csv|zip|json|aduomen|adr_|gatv|atviri' | sort -u | head -40 >> out.txt
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/raw && touch data/raw/.keep && git add data/raw && git commit -qm "Adresų registro duomenys: savivaldybės, gyvenvietės, gatvės" && git push -q origin HEAD:claude/streets-data && echo "Įkelta į šaką" >> out.txt || echo "Įkelti nepavyko" >> out.txt
          exit 0
