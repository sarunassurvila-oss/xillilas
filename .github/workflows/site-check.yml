name: Svetainės patikra
on:
  push:
    branches: [claude/site-check]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Patikrinti svetainę, Supabase ir Google
        run: |
          set -u
          {
          SITE=""
          for s in https://xillilas.vercel.app https://xillilas-sarunassurvila-1289.vercel.app; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$s/")
            echo "$s -> HTTP $c"
            if [ "$c" = 200 ] && [ -z "$SITE" ]; then SITE=$s; fi
          done
          if [ -z "$SITE" ]; then echo "REZULTATAS: svetainė nepasiekiama"; else
          echo "SITE=$SITE"

          echo "== 1. Pradžios puslapis =="
          curl -s -o home.html "$SITE/"
          grep -o '<title>[^<]*' home.html | head -1
          grep -q 'Supabase dar neprijungtas' home.html && echo "BUSENA1: SUPABASE_NEPRIJUNGTAS"
          grep -q 'Nepavyko įkelti skelbimų' home.html && echo "BUSENA1: DB_KLAIDA"
          grep -q 'Skelbimų dar nėra' home.html && echo "BUSENA1: DB_VEIKIA_SKELBIMU_NERA"
          echo "Kortelių: $(grep -o 'class="card"' home.html | wc -l)"
          echo "Kainų lentelė: $(grep -q 'Butų kainos miestuose' home.html && echo yra || echo NĖRA), konkurentų pavadinimai: $(grep -oiE 'aruodas|ober-haus|domoplius|skelbiu\.lt' home.html | sort -u | tr '\n' ' ' | grep . || echo nėra); miestai: $(grep -oE '(Vilnius|Kaunas|Klaipėda|Šiauliai|Panevėžys|Alytus)</a>' home.html | sed 's#</a>##' | tr '\n' ' ')"
          echo "Kainos: $(for n in 3197 2339 2103 1457 1432; do a=${n:0:1}; b=${n:1}; LC_ALL=C.UTF-8 grep -qP "${a}[\x{00A0}\x{202F} ]${b}" home.html && printf '%s✓ ' $n || printf '%s✗ ' $n; done)"

          echo "== Išsami paieška =="
          for qs in 'type=butas&nl=1' 'type=butas&en=A%2B%2B' 'type=butas&nl=1&nf=1&fmin=2&ymin=1980&en=B&bld=M%C5%ABrinis&heat=Centrinis&fin=%C4%AErengtas&feat=Balkonas&umin=100&days=30&photos=1' 'type=sklypas&purpose=Gyvenamasis&umax=5000' 'type=namas&plmin=5&plmax=50'; do
            curl -s -o adv.html "$SITE/?$qs"
            st=$(grep -q 'Nepavyko įkelti skelbimų' adv.html && echo KLAIDA || echo gerai)
            echo "?$qs -> $st, skydelis: $(grep -q 'id="adv-panel"' adv.html && echo 'ATIDARYTAS (blogai)' || echo paslėptas), kortelių: $(grep -o 'class="card"' adv.html | wc -l)"
          done
          echo "Mygtukas „Išsami paieška“ pradžioje: $(grep -q 'Išsami paieška' home.html && echo yra || echo NĖRA)"

          echo "== Žemėlapis =="
          curl -s -o map.html "$SITE/?view=map"
          echo "?view=map: $(grep -q 'Nepavyko įkelti skelbimų' map.html && echo KLAIDA || echo gerai), žemėlapio blokas: $(grep -q 'class="lmap"' map.html && echo yra || echo NĖRA), pastaba: $(grep -oE 'Žemėlapyje [^<]{0,90}' map.html | head -1)"
          V=$(grep -oE 'maplibre-gl-[0-9]+\.[0-9]+\.[0-9]+' bundle.js map.html 2>/dev/null | head -1 | sed 's/.*maplibre-gl-//'); V=${V:-6.14.0}
          for f in maplibre-gl.mjs maplibre-gl-worker.mjs; do echo "vendor/$f: $(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}B' "$SITE/vendor/maplibre-gl-$V/$f")"; done
          echo "OpenFreeMap stilius: $(curl -s -o style.json -w '%{http_code}' https://tiles.openfreemap.org/styles/positron) ($(jq -r '.sources | keys | join(",")' style.json 2>/dev/null))"
          ID=$(grep -oE '/skelbimas/[0-9]+' home.html | head -1)
          [ -n "$ID" ] && echo "Skelbimo $ID vietos žemėlapis: $(curl -s "$SITE$ID" | grep -q 'Vieta žemėlapyje' && echo yra || echo nėra)"

          echo "== Prenumeratos =="
          echo "Mygtukas rezultatuose: $(grep -q 'Gauti naujus skelbimus el. paštu' home.html && echo yra || echo NĖRA)"
          echo "/prenumerata/atsisakyti: $(curl -s "$SITE/prenumerata/atsisakyti?t=00000000-0000-0000-0000-000000000000" | grep -o '<h1>[^<]*' | head -1 | sed 's/<h1>//')"
          echo "/mano/prenumeratos be prisijungimo: $(curl -s -o /dev/null -w '%{http_code} → %{redirect_url}' "$SITE/mano/prenumeratos")"
          echo "/api/atsisakyti (POST, neteisingas žetonas): $(curl -s -X POST "$SITE/api/atsisakyti?t=x")"

          echo "== Paleidimui =="
          echo "robots.txt: $(curl -s -o /dev/null -w '%{http_code}' "$SITE/robots.txt"), sitemap.xml: $(curl -s -o sm.xml -w '%{http_code}' "$SITE/sitemap.xml") ($(grep -o '<loc>' sm.xml | wc -l) adresai, skelbimų: $(grep -o '/skelbimas/' sm.xml | wc -l))"
          echo "og:image: $(grep -oE 'property="og:image" content="[^"]+' home.html | sed 's/.*content="//' | head -1) -> $(curl -s -o /dev/null -w '%{http_code}' "$SITE/og.png")"
          echo "Gatvės: vilnius.json $(curl -s -o st.json -w '%{http_code}' "$SITE/streets/vilnius.json") ($(grep -o '"' st.json | wc -l) kabučių), kauno-r.json $(curl -s -o /dev/null -w '%{http_code}' "$SITE/streets/kauno-r.json")"
          echo "Statistika: $(grep -q '_vercel/insights' home.html && echo įdiegta || echo nerasta)"
          echo "Privatumo politika su įmonės duomenimis: $(curl -s "$SITE/privatumas" | grep -q 'Įmonės pavadinimas\]' && echo 'NE (dar šablonas)' || echo taip)"
          echo "== 2. Supabase =="
          curl -s -o login.html "$SITE/prisijungti"
          grep -q 'Tęsti su Google' login.html && echo "Prisijungimo mygtukas: yra"
          echo "El. pašto forma: $(grep -q 'class="name-auth"' login.html && echo rodoma || echo nerodoma)"
          for js in $(cat home.html login.html | grep -oE '/_next/static/[^"]+\.js' | sort -u); do curl -s "$SITE$js"; done > bundle.js
          URL=$(grep -oE 'https://[a-z0-9]{20}\.supabase\.co' bundle.js | head -1)
          KEY=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' bundle.js | head -1)
          [ -z "$KEY" ] && KEY=$(grep -oE 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' bundle.js | head -1)
          echo "Supabase URL: ${URL:-NERASTAS}"
          [ -n "$KEY" ] && echo "Raktas: rastas" || echo "Raktas: NERASTAS"
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            echo "-- Lentelė listings:"
            curl -s -o t.json -w 'HTTP %{http_code}\n' "$URL/rest/v1/listings?select=id&limit=1" -H "apikey: $KEY"; head -c 200 t.json; echo
            echo "-- Stulpelis floor_is_last:"
            curl -s -o fl.json -w 'HTTP %{http_code}\n' "$URL/rest/v1/listings?select=id,floor_is_last&limit=1" -H "apikey: $KEY"; head -c 200 fl.json; echo
            echo "-- Funkcija listing_type_counts:"
            curl -s -o f.json -w 'HTTP %{http_code}\n' "$URL/rest/v1/rpc/listing_type_counts?p_deal=sale" -H "apikey: $KEY"; head -c 200 f.json; echo
            echo "-- Prisijungimo tiekėjai:"
            curl -s "$URL/auth/v1/settings" -H "apikey: $KEY" | grep -oE '"(google|email|mailer_autoconfirm)":(true|false)' | tr '\n' ' '; echo

            echo "== 3. Google =="
            loc=$(curl -s -o a.txt -w '%{redirect_url}' "$URL/auth/v1/authorize?provider=google&redirect_to=$SITE/auth/callback")
            echo "Supabase nukreipia į: $(echo "$loc" | cut -c1-60)"
            head -c 200 a.txt; echo
            if echo "$loc" | grep -q accounts.google.com; then
              echo "client_id: $(echo "$loc" | grep -oE 'client_id=[^&]+' | cut -c1-40)…"
              echo "redirect_uri: $(echo "$loc" | grep -oE 'redirect_uri=[^&]+')"
              g=$(curl -s -o g.html -w '%{http_code} %{redirect_url}' -A 'Mozilla/5.0' "$loc")
              echo "Google atsakas: $(echo "$g" | cut -c1-90)"
              grep -oE 'redirect_uri_mismatch|invalid_client|deleted_client|disabled_client|Access blocked|Error 400[^<]{0,60}|Error 401[^<]{0,60}' g.html | sort -u | head -5
            fi
          fi
          fi
          } > out.txt 2>&1
          cat out.txt
          body=$(sed -e 's/%/%25/g' out.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Patikra::$body"

      - name: Žemėlapis tikroje naršyklėje
        run: |
          set +e
          npm i --no-save --no-audit --no-fund playwright-core@1.63.0 > npm.log 2>&1 || echo "::notice title=Zemelapis::npm: $(tail -3 npm.log | tr '\n' ' ' | cut -c1-200)"
          cat > m.mjs <<'JS'
          import { chromium } from 'playwright-core'
          const b = await chromium.launch({ channel: 'chrome' })
          const p = await b.newPage({ viewport: { width: 1280, height: 900 } })
          const errs = []
          p.on('pageerror', (e) => errs.push(e.message))
          p.on('console', (m) => m.type() === 'error' && errs.push(m.text()))
          await p.goto('https://xillilas.vercel.app/?view=map#rezultatai', { waitUntil: 'load' })
          await p.locator('.lmap canvas').waitFor({ timeout: 30000 }).catch(() => {})
          const canvas = await p.locator('.lmap canvas').count()
          await p.waitForTimeout(4000)
          const prices = await p.locator('.mk-price').count(), clusters = await p.locator('.mk-cluster').count()
          const tiles = await p.evaluate(() => performance.getEntriesByType('resource').filter((r) => r.name.includes('openfreemap')).length)
          let popup = '-'
          if (prices) { await p.locator('.mk-price').first().click(); await p.waitForTimeout(600); popup = await p.locator('.mpop-main').getAttribute('href').catch(() => 'nėra') }
          const head = await p.locator('.maplist-head').innerText().catch(() => '-')
          const cards = await p.locator('.mcard').count()
          const gmaps = await p.locator('.mpop-gmaps').getAttribute('href').catch(() => '-')
          const d = await b.newPage({ viewport: { width: 1280, height: 900 } })
          await d.goto('https://xillilas.vercel.app/?city=Vilnius', { waitUntil: 'load' })
          await d.click('.dp-btn'); const dn = await d.locator('.dp-list label').count()
          console.log(`::notice title=Zemelapis::canvas ${canvas}, kainų žymės ${prices}, grupės ${clusters}, OpenFreeMap užklausų ${tiles}, langelis ${popup}, Google Maps ${gmaps}, sąrašas: „${head}“ (${cards} kort.), Vilniaus mikrorajonų sąraše: ${dn}, klaidos: ${errs.filter((e) => !/insights/.test(e)).join(' | ').slice(0, 300) || 'nėra'}`)
          await b.close()
          JS
          sed -i 's/^          //' m.mjs
          node m.mjs > m.log 2>&1; cat m.log; grep -q '::notice' m.log || echo "::notice title=Zemelapis::klaida: $(grep -v '^\s*$' m.log | tail -4 | tr '\n' ' ' | cut -c1-300)"

      - name: Domenų laisvumas (.lt)
        run: |
          set +e
          out=""
          for n in kurgyventi kurgyvenu ieskaubuto ieskaunamo noriubuto bustopaieska ntpaieska manobustas manonamai bustoraktas naujiraktai namoraktai raktine kvartalas kaimynai kaimynas nuosavas nuosavybe nuosavasbustas ntzemelapis ntkampas visasnt ntskelbimai bustoturgus bustomuge nttaskas kvadratukas kvadratynas slenkstis naujasbustas savasbustas bustopasaulis namuvartai raktasnamo pirmasbustas; do
            r=$(printf 'get 1.0 %s.lt\n' "$n" | timeout 8 nc das.domreg.lt 4343 2>/dev/null | grep -i '^Status:' | head -1 | sed 's/Status: *//I')
            [ -z "$r" ] && r=$(timeout 8 whois -h whois.domreg.lt "$n.lt" 2>/dev/null | grep -i '^Status:' | head -1 | sed 's/Status: *//I')
            out="$out$n.lt=${r:-?}; "
            sleep 0.4
          done
          echo "::notice title=Domenai::$out"
