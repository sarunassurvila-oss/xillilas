name: Supabase ir Vercel nustatymas
on:
  push:
    branches: [claude/supabase-setup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Nustatyti Supabase (ir Vercel, jei yra raktas)
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SITE: https://xillilas.vercel.app
          VERCEL_PROJECT: xillilas
          VERCEL_SCOPE: sarunassurvila-1289
        run: |
          set -uo pipefail
          : > out.txt
          log() { echo "$*" | tee -a out.txt; }
          finish() {
            body=$(sed -e 's/%/%25/g' out.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=Nustatymas::$body"
          }
          main() {
            [ -n "${SUPABASE_TOKEN:-}" ] || { log "KLAIDA: GitHub'e nėra slapto rakto SUPABASE_TOKEN"; return; }
            SUPABASE_TOKEN=$(printf '%s' "$SUPABASE_TOKEN" | tr -d '[:space:]')
            case "$SUPABASE_TOKEN" in sbp_*) ;; *) log "ĮSPĖJIMAS: raktas neprasideda „sbp_“ (ilgis ${#SUPABASE_TOKEN} simb.)";; esac
            API=https://api.supabase.com/v1
            H=(-H "Authorization: Bearer $SUPABASE_TOKEN" -H "Content-Type: application/json")

            code=$(curl -s -o projects.json -w '%{http_code}' "${H[@]}" "$API/projects")
            if [ "$code" != 200 ]; then
              log "KLAIDA: Supabase atsakė HTTP $code: $(jq -r '.message // .error // empty' projects.json 2>/dev/null | cut -c1-200)"
              [ "$code" = 401 ] && log "Raktas netinka: patikrinkite, ar nukopijavote visą sbp_ raktą ir ar jis neatšauktas (Supabase → Account → Access Tokens)."
              return
            fi
            projects=$(cat projects.json)
            REF=$(echo "$projects" | jq -r '([.[] | select(.name | test("bustas|slenkstis|xil"; "i"))][0] // (if length == 1 then .[0] else null end)) | if . == null then empty else (.ref // .id) end')
            if [ -z "$REF" ]; then
              orgs=$(curl -s "${H[@]}" "$API/organizations")
              ORG=$(echo "$orgs" | jq -r 'if type == "array" then (.[0] | (.slug // .id)) // empty else empty end')
              if [ -z "$ORG" ]; then
                log "Raktui matomi projektai: $(echo "$projects" | jq -r 'if type == "array" and length > 0 then map(.name + " (" + (.region // "?") + ", " + (.status // "?") + ")") | join("; ") else "(nėra)" end')"
                log "Raktui matomos organizacijos: $(echo "$orgs" | jq -r 'if type == "array" and length > 0 then map(.name) | join(", ") else "(nėra)" end')"
                log "KLAIDA: Supabase projekto „bustas“ dar nėra, o automatiškai jo sukurti neleidžiama."
                log "Sukurkite jį: supabase.com/dashboard → New project → organizacija „bustas“, pavadinimas „bustas“, regionas Central EU (Frankfurt)."
                return
              fi
              PASS=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32)
              mk() { curl -s "${H[@]}" -X POST "$API/projects" -d "$(jq -n --arg o "$ORG" --arg p "$PASS" --arg f "$1" '{name: "bustas", region: "eu-central-1", db_pass: $p} + {($f): $o}')"; }
              resp=$(mk organization_slug)
              REF=$(echo "$resp" | jq -r '.ref // .id // empty')
              if [ -z "$REF" ]; then
                log "Bandymas 1 (organization_slug): $(echo "$resp" | jq -c '.' 2>/dev/null | cut -c1-300 || echo "$resp" | cut -c1-300)"
                resp=$(mk organization_id); REF=$(echo "$resp" | jq -r '.ref // .id // empty')
                [ -n "$REF" ] || log "Bandymas 2 (organization_id): $(echo "$resp" | jq -c '.' 2>/dev/null | cut -c1-300 || echo "$resp" | cut -c1-300)"
              fi
              [ -n "$REF" ] || log "Organizacija: $(curl -s "${H[@]}" "$API/organizations/$ORG" | jq -c '{name, plan, opt_in_tags} // .' | cut -c1-200)"
              [ -n "$REF" ] || { log "KLAIDA: projekto sukurti nepavyko: $(echo "$resp" | jq -c '.message // .' | cut -c1-300)"; return; }
              log "Sukurtas Supabase projektas „bustas“ (Frankfurtas)"
            else
              log "Rastas Supabase projektas: $(echo "$projects" | jq -r --arg r "$REF" '.[] | select((.ref // .id) == $r) | .name + " (" + .region + ")"')"
            fi

            st=""
            for i in $(seq 1 60); do
              st=$(curl -s "${H[@]}" "$API/projects/$REF" | jq -r '.status // empty')
              [ "$st" = ACTIVE_HEALTHY ] && break
              sleep 10
            done
            [ "$st" = ACTIVE_HEALTHY ] || { log "KLAIDA: projektas dar neparuoštas (būsena: $st). Paleiskite dar kartą po kelių minučių."; return; }

            q() { curl -s "${H[@]}" -X POST "$API/projects/$REF/database/query" -d "$(jq -n --arg q "$1" '{query: $q}')"; }
            exists=""
            for i in $(seq 1 18); do
              exists=$(q "select to_regclass('public.listings') is not null as e" | jq -r 'if type == "array" then (.[0].e | tostring) else empty end')
              [ -n "$exists" ] && break
              sleep 10
            done
            if [ "$exists" = true ]; then
              log "Duomenų bazės schema jau įdiegta"
            else
              r=$(jq -Rs '{query: .}' supabase/migrations/0001_init.sql | curl -s "${H[@]}" -X POST "$API/projects/$REF/database/query" --data-binary @-)
              if echo "$r" | jq -e 'type == "array"' >/dev/null 2>&1; then
                log "Duomenų bazės schema įdiegta"
              else
                log "KLAIDA: schemos įdiegti nepavyko: $(echo "$r" | jq -c '.message // .' | cut -c1-400)"; return
              fi
            fi
            # Vėlesnės migracijos parašytos taip, kad jas galima kartoti.
            for f in supabase/migrations/*.sql; do
              [ "$(basename "$f")" = 0001_init.sql ] && continue
              r=$(jq -Rs '{query: .}' "$f" | curl -s "${H[@]}" -X POST "$API/projects/$REF/database/query" --data-binary @-)
              if echo "$r" | jq -e 'type == "array"' >/dev/null 2>&1; then
                log "Migracija pritaikyta: $(basename "$f")"
              else
                log "KLAIDA: migracija $(basename "$f") nepavyko: $(echo "$r" | jq -c '.message // .' | cut -c1-400)"; return
              fi
            done
            log "Apsauga guard_password_accounts: $(q "select count(*) as n from pg_trigger where tgname = 'guard_password_accounts' and tgrelid = 'auth.users'::regclass" | jq -r 'if type == "array" and .[0].n == 1 then "įdiegta" else "NĖRA" end')"
            log "Stulpelis floor_is_last: $(q "select count(*) as n from information_schema.columns where table_schema = 'public' and table_name = 'listings' and column_name = 'floor_is_last'" | jq -r 'if type == "array" and .[0].n == 1 then "yra" else "NĖRA" end')"

            keys=$(curl -s "${H[@]}" "$API/projects/$REF/api-keys")
            PUB=$(echo "$keys" | jq -r '[.[] | select(.type == "publishable")][0].api_key // empty')
            [ -n "$PUB" ] || PUB=$(echo "$keys" | jq -r '[.[] | select(.name == "anon")][0].api_key // empty')
            [ -n "$PUB" ] || { log "KLAIDA: nerastas viešasis (publishable) raktas"; return; }
            URL="https://$REF.supabase.co"

            a=$(curl -s "${H[@]}" -X PATCH "$API/projects/$REF/config/auth" \
              -d "$(jq -n --arg s "$SITE" '{site_url: $s, uri_allow_list: ($s + "/auth/callback,http://localhost:3000/auth/callback")}')")
            if [ "$(echo "$a" | jq -r '.site_url // empty')" = "$SITE" ]; then log "Prisijungimo adresai nustatyti ($SITE). Slapyvardžių paskyros (keičiama Supabase skydelyje): $(echo "$a" | jq -r 'if .external_email_enabled and .mailer_autoconfirm then "įjungtos" elif .external_email_enabled then "el. paštas įjungtas, bet reikalauja patvirtinimo" else "išjungtos" end'), min. slaptažodžio ilgis: $(echo "$a" | jq -r '.password_min_length')"; else log "ĮSPĖJIMAS: prisijungimo adresų nustatyti nepavyko: $(echo "$a" | jq -c '.message // .' | cut -c1-200)"; fi
            GOOGLE_CLIENT_ID=$(printf '%s' "${GOOGLE_CLIENT_ID:-}" | tr -d '[:space:]')
            GOOGLE_CLIENT_SECRET=$(printf '%s' "${GOOGLE_CLIENT_SECRET:-}" | tr -d '[:space:]')
            if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
              a=$(curl -s "${H[@]}" -X PATCH "$API/projects/$REF/config/auth" \
                -d "$(jq -n --arg i "$GOOGLE_CLIENT_ID" --arg c "$GOOGLE_CLIENT_SECRET" '{external_google_enabled: true, external_google_client_id: $i, external_google_secret: $c}')")
              [ "$(echo "$a" | jq -r '.external_google_enabled // false')" = true ] || log "KLAIDA: Google įjungti nepavyko: $(echo "$a" | jq -c '.message // .' | cut -c1-200)"
            fi
            g=$(echo "$a" | jq -r '.external_google_enabled // false')
            log "Google prisijungimas Supabase: $([ "$g" = true ] && echo įjungtas || echo dar neįjungtas)"

            log "NEXT_PUBLIC_SUPABASE_URL=$URL"
            log "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUB"
            log "Google redirect URI: $URL/auth/v1/callback"

            if [ -z "${VERCEL_TOKEN:-}" ]; then
              log "Vercel: rakto nėra – šias dvi reikšmes įrašykite Vercel → Settings → Environment Variables ir paspauskite Redeploy"
              return
            fi
            V=https://api.vercel.com
            VH=(-H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json")
            body=$(jq -n --arg u "$URL" --arg k "$PUB" '[
              {key: "NEXT_PUBLIC_SUPABASE_URL", value: $u, type: "plain", target: ["production", "preview", "development"]},
              {key: "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY", value: $k, type: "plain", target: ["production", "preview", "development"]}]')
            e=$(curl -s "${VH[@]}" -X POST "$V/v10/projects/$VERCEL_PROJECT/env?upsert=true&slug=$VERCEL_SCOPE" -d "$body")
            if echo "$e" | jq -e '.error' >/dev/null 2>&1; then log "KLAIDA Vercel raktuose: $(echo "$e" | jq -r '.error.message' | cut -c1-200)"; return; fi
            log "Vercel: Supabase raktai įrašyti"
            d=$(curl -s "${VH[@]}" -X POST "$V/v13/deployments?slug=$VERCEL_SCOPE" \
              -d '{"name":"xillilas","project":"xillilas","target":"production","gitSource":{"type":"github","org":"sarunassurvila-oss","repo":"xillilas","ref":"main"}}')
            if echo "$d" | jq -e '.id' >/dev/null 2>&1; then log "Vercel: paleistas naujas paskelbimas (užtruks 1–2 min.)"; else log "KLAIDA Vercel paskelbime: $(echo "$d" | jq -r '.error.message // .' | cut -c1-200)"; fi
          }
          main
          finish
